<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" href="favicons/favicon-16x16.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>PreventCar | Login</title>

    <script>
        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.add('light-mode');
        }
    </script>
</head>

<body>
    <div class="login-container">
        <!-- Painel Esquerdo (Ilustração) -->
        <div class="left-panel">
            <div class="branding">
                <h1>PreventCar</h1>
                <p>A maneira inteligente de<br>cuidar do seu veículo</p>
            </div>
            <div class="illustration">
                <div class="car-wrapper">
                    <i class="fa-solid fa-gear floating-icon icon-1"></i>
                    <i class="fa-solid fa-plug floating-icon icon-2"></i>
                    <i class="fa-solid fa-car-battery floating-icon icon-3"></i>
                    <i class="fa-solid fa-circle-exclamation floating-icon icon-4"></i>
                    <i class="fa-solid fa-wrench floating-icon icon-5"></i>
                    <i class="fa-solid fa-oil-can floating-icon icon-6"></i>
                    <img src="images/carroLogin.png" alt="Ilustração do Carro PreventCar" class="blue-car">
                </div>
            </div>
        </div>

        <!-- Painel Direito (Formulário) -->
        <div class="right-panel">
            <button id="theme-toggle" class="theme-toggle login-theme-btn" aria-label="Mudar tema"
                style="position: absolute; top: 20px; right: 20px;">
                <i class="fa-solid fa-sun"></i>
            </button>
            <div class="login-card">

                <a href="index.html" class="back-home"><i class="fa-solid fa-arrow-left"></i> Voltar</a>

                <div class="logo">
                    <img src="images/logo.png" alt="Logo PreventCar">
                    <h2>Prevent<span>Car</span></h2>
                </div>

                <div class="welcome-text">
                    <h3>Seja bem-vindo de volta!</h3>
                    <p>Faça login para acessar sua garagem</p>
                </div>

                <form action="#">
                    <div class="input-group">
                        <label for="email">E-mail</label>
                        <div class="input-wrapper">
                            <i class="fa-regular fa-envelope"></i>
                            <input type="email" id="email" placeholder="Digite seu e-mail" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="password">Senha</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="password" placeholder="Digite sua senha" required>
                            <i class="fa-regular fa-eye toggle-password" id="togglePassword"></i>
                        </div>
                    </div>

                    <div class="form-actions">
                        <label class="remember-me">
                            <input type="checkbox" checked>
                            Lembrar de mim
                        </label>
                        <a href="#" class="forgot-password">Esqueceu sua senha?</a>
                    </div>

                    <button type="submit" class="btn-login">Entrar na Plataforma</button>

                    <div class="divider">
                        <span>ou</span>
                    </div>

                    <button type="button" class="btn-google">
                        <i class="fa-brands fa-google"></i> Entrar com o Google
                    </button>
                </form>

                <div class="signup-link">
                    <p>Não possui conta? <a href="cadastro.html">Cadastre-se</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/login.js"></script>
   
</body>

</html>
